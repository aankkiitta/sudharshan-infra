<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up · FurnitureCraft</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-bg: #FAF8F5;
      --color-white: #FFFFFF;
      --color-black: #1A1A1A;
      --color-primary: #2c5530;
      --color-primary-light: #3a6e3f;
      --color-primary-lighter: #e8f0e6;
      --color-text: #2C2C2C;
      --color-text-light: #6B6B6B;
      --color-border: #E8E3DC;
      --radius: 12px;
      --font: 'Inter', sans-serif;
      --font-serif: 'Playfair Display', serif;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }

    .auth-card {
      background: var(--color-white);
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      box-shadow: 0 8px 30px rgba(0,0,0,0.04);
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      transition: 0.3s;
      margin: 0 auto;
    }

    .auth-card .brand-icon {
      text-align: center;
      margin-bottom: 10px;
    }
    .auth-card .brand-icon i {
      font-size: 2.2rem;
      color: var(--color-primary);
      background: var(--color-primary-lighter);
      padding: 12px;
      border-radius: 50%;
    }

    .auth-card h2 {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .auth-card .sub {
      text-align: center;
      color: var(--color-text-light);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-light);
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 0.95rem;
      background: var(--color-bg);
      transition: 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(44,85,48,0.06);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: var(--color-white);
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      transition: 0.3s;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-primary:hover {
      background: var(--color-primary-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(44,85,48,0.25);
    }

    .auth-footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--color-text-light);
    }
    .auth-footer a {
      color: var(--color-primary);
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 18px 0 16px;
      color: var(--color-text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .social-login {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .social-login button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--color-border);
      border-radius: 60px;
      background: var(--color-white);
      font-weight: 500;
      font-size: 0.85rem;
      transition: 0.2s;
      color: var(--color-text);
    }
    .social-login button:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-lighter);
    }
    .social-login button i { font-size: 1.1rem; }

    /* responsive */
    @media (max-width: 480px) {
      .auth-card { padding: 28px 18px; }
      .auth-card h2 { font-size: 1.4rem; }
    }
    @media (max-height: 700px) {
      .auth-card { padding: 28px 24px; }
      .auth-card .brand-icon i { font-size: 1.8rem; padding: 10px; }
      .auth-card h2 { font-size: 1.4rem; }
      .form-group { margin-bottom: 12px; }
      .form-group input { padding: 10px 14px; }
      .btn-primary { padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- Signup Card -->
  <div class="auth-card">
    <div class="brand-icon">
      <i class="fas fa-user-plus"></i>
    </div>

    <h2>Create Account</h2>
    <p class="sub">Join Sudarshan Infra and manage your projects.</p>

    <form id="signupForm">

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          id="full_name"
          placeholder="John Doe"
          required
        />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Minimum 8 characters"
          required
        />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter password"
          required
        />
      </div>



      <div class="form-group">
    <label>Profile Picture</label>

    <input
        type="file"
        id="avatar"
        accept="image/*"
    >

    <br><br>

    <img
        id="preview"
        src="https://via.placeholder.com/120?text=Avatar"
        width="120"
        height="120"
        style="border-radius:50%;object-fit:cover;border:2px solid #ddd;"
    >
</div>
      <button type="submit" class="btn-primary">
        <i class="fas fa-user-check"></i>
        Sign Up
      </button>

    </form>

    <div class="divider">or continue with</div>

    <div class="social-login">
      <button type="button">
        <i class="fab fa-google"></i>
        Google
      </button>

      <button type="button">
        <i class="fab fa-facebook-f"></i>
        Facebook
      </button>
    </div>

    <div class="auth-footer">
      Already have an account?
      <a href="login.html">Log in</a>
    </div>

  </div>

<script>

const avatar = document.getElementById("avatar");
const preview = document.getElementById("preview");

avatar.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        preview.src = URL.createObjectURL(file);

    }

});

document.getElementById("signupForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const full_name = document.getElementById("full_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(password !== confirmPassword){

        alert("Passwords do not match.");
        return;

    }

    const formData = new FormData();

    formData.append("full_name", full_name);
    formData.append("email", email);
    formData.append("password", password);

    if(avatar.files.length > 0){

        formData.append("avatar", avatar.files[0]);

    }

    try{

        const response = await fetch("/api/signup",{

            method:"POST",
            body:formData

        });

        const data = await response.json();

        if(data.success){

            alert("Account created successfully!");

            window.location.href="login.html";

        }else{

            alert(data.message);

        }

    }catch(error){

        console.error(error);
        alert("Server Error");

    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · FurnitureCraft</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-bg: #FAF8F5;
      --color-white: #FFFFFF;
      --color-black: #1A1A1A;
      --color-primary: #2c5530;
      --color-primary-light: #3a6e3f;
      --color-primary-lighter: #e8f0e6;
      --color-text: #2C2C2C;
      --color-text-light: #6B6B6B;
      --color-border: #E8E3DC;
      --radius: 12px;
      --font: 'Inter', sans-serif;
      --font-serif: 'Playfair Display', serif;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }

    .auth-card {
      background: var(--color-white);
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      box-shadow: 0 8px 30px rgba(0,0,0,0.04);
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      transition: 0.3s;
      margin: 0 auto;
    }

    .auth-card .brand-icon {
      text-align: center;
      margin-bottom: 10px;
    }
    .auth-card .brand-icon i {
      font-size: 2.2rem;
      color: var(--color-primary);
      background: var(--color-primary-lighter);
      padding: 12px;
      border-radius: 50%;
    }

    .auth-card h2 {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .auth-card .sub {
      text-align: center;
      color: var(--color-text-light);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-light);
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 0.95rem;
      background: var(--color-bg);
      transition: 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(44,85,48,0.06);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: var(--color-white);
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      transition: 0.3s;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-primary:hover {
      background: var(--color-primary-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(44,85,48,0.25);
    }

    .auth-footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--color-text-light);
    }
    .auth-footer a {
      color: var(--color-primary);
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 18px 0 16px;
      color: var(--color-text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .social-login {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .social-login button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--color-border);
      border-radius: 60px;
      background: var(--color-white);
      font-weight: 500;
      font-size: 0.85rem;
      transition: 0.2s;
      color: var(--color-text);
    }
    .social-login button:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-lighter);
    }
    .social-login button i { font-size: 1.1rem; }

    .forgot-link {
      text-align: right;
      margin-top: 4px;
    }
    .forgot-link a {
      font-size: 0.75rem;
      color: var(--color-primary);
      font-weight: 500;
    }
    .forgot-link a:hover { text-decoration: underline; }

    /* responsive */
    @media (max-width: 480px) {
      .auth-card { padding: 28px 18px; }
      .auth-card h2 { font-size: 1.4rem; }
    }
    @media (max-height: 700px) {
      .auth-card { padding: 28px 24px; }
      .auth-card .brand-icon i { font-size: 1.8rem; padding: 10px; }
      .auth-card h2 { font-size: 1.4rem; }
      .form-group { margin-bottom: 12px; }
      .form-group input { padding: 10px 14px; }
      .btn-primary { padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- Login Card -->
  <div class="auth-card">

    <div class="brand-icon">
      <i class="fas fa-lock"></i>
    </div>

    <h2>Welcome Back</h2>
    <p class="sub">Log in to your Sudarshan Infra account.</p>

    <form id="loginForm">

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        />

        <div class="forgot-link">
          <a href="#">Forgot Password?</a>
        </div>
      </div>

      <button type="submit" class="btn-primary">
        <i class="fas fa-sign-in-alt"></i>
        Log In
      </button>

    </form>

    <div class="divider">or continue with</div>

    <div class="social-login">
      <button type="button">
        <i class="fab fa-google"></i>
        Google
      </button>

      <button type="button">
        <i class="fab fa-facebook-f"></i>
        Facebook
      </button>
    </div>

    <div class="auth-footer">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </div>

  </div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try{

       const response = await fetch("https://sudharshan-infra.onrender.com/api/login", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email,
                password
            })

        });

        const data = await response.json();

       if(data.success){
        
console.log(data);
console.log(data.user);
console.log(data.user[0]);
    // Save JWT Token
    localStorage.setItem("token", data.token);

    // Save User Object
    localStorage.setItem("user", JSON.stringify(data.user));

    // Login Status
    localStorage.setItem("isLoggedIn", "true");

    // Username
localStorage.setItem("userName", data.user.full_name);

    alert("Login Successful!");

    window.location.href = "next1.html";

}else{

            alert(data.message);

        }

    }catch(err){

        console.error(err);
        alert("Unable to connect to server.");

    }

});

</script>

</body>
</html>

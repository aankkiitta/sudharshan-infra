  /* ============================================================

/* ============================================================
   1. FLOATING WIDGET
   ============================================================ */
.chat-widget {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 150px;
  height: 150px;
  cursor: pointer;
  z-index: 999999;
  animation: float 3s ease-in-out infinite;
  transition: transform 0.3s ease;
}

.chat-widget img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  filter: drop-shadow(0 12px 24px rgba(0, 30, 0, 0.2));
  transition: transform 0.3s ease;
}

.chat-widget:hover {
  transform: scale(1.08);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ============================================================
   2. OVERLAY
   ============================================================ */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 9999997;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  background: rgba(0, 0, 0, 0.2);
}

.overlay.active {
  opacity: 1;
  pointer-events: auto;
}

<script>
  (function() {
    // ============================================================
    // DOM refs
    // ============================================================
    const widget = document.getElementById('chatWidget');
    const sidePanel = document.getElementById('chatSidePanel');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closePanelBtn');
    const messages = document.getElementById('chatMessages');
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const quickGrid = document.getElementById('quickGrid');

    // ============================================================
    // Panel controls
    // ============================================================
    function openPanel() {
      sidePanel.classList.add('open');
      overlay.classList.add('active');
      setTimeout(() => input.focus(), 250);
    }
    function closePanel() {
      sidePanel.classList.remove('open');
      overlay.classList.remove('active');
    }

    // Single widget click handler
    widget.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!sidePanel.classList.contains('open')) {
        openPanel();
      } else {
        input.focus();
      }
    });

    overlay.addEventListener('click', closePanel);
    closeBtn.addEventListener('click', closePanel);

    // ============================================================
    // Message helpers
    // ============================================================
    function addMessage(text, sender = 'bot', isHTML = false) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      const icon = sender === 'bot' ? '🤖' : '🧑';
      if (isHTML) {
        div.innerHTML = `<span class="icon">${icon}</span> ${text}`;
      } else {
        div.innerHTML = `<span class="icon">${icon}</span> ${text}`;
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing-indicator';
      div.id = 'typingIndicator';
      div.innerHTML = '<span></span><span></span><span></span>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
    function hideTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // ============================================================
    // QUOTATION FORM (embedded in chat)
    // ============================================================
    function renderQuoteForm() {
      const oldForm = document.getElementById('quoteFormContainer');
      if (oldForm) oldForm.remove();

      const container = document.createElement('div');
      container.id = 'quoteFormContainer';
      container.className = 'quote-form-container active';
      container.innerHTML = `
        <div class="form-row">
          <label>Full Name *</label>
          <input type="text" id="qfName" placeholder="Your full name" />
        </div>
        <div class="form-row">
          <label>Email Address *</label>
          <input type="email" id="qfEmail" placeholder="you@example.com" />
        </div>
        <div class="form-row">
          <label>Phone Number *</label>
          <input type="tel" id="qfPhone" placeholder="+91 98765 43210" />
        </div>
        <div class="form-row">
          <label>Project Type</label>
          <select id="qfProject">
            <option value="Office">Office</option>
            <option value="Furniture">Furniture</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Painting">Painting</option>
            <option value="False Ceiling">False Ceiling</option>
            <option value="Electrical">Electrical</option>
            <option value="Civil">Civil</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-row">
          <label>Project Details (Budget, Timeline, Requirements)</label>
          <textarea id="qfMessage" placeholder="Describe your project..."></textarea>
        </div>
        <button class="submit-quote-btn" id="submitQuoteBtn">📩 Submit Quotation</button>
      `;
      messages.appendChild(container);
      messages.scrollTop = messages.scrollHeight;

      document.getElementById('submitQuoteBtn').addEventListener('click', function() {
        const name = document.getElementById('qfName').value.trim();
        const email = document.getElementById('qfEmail').value.trim();
        const phone = document.getElementById('qfPhone').value.trim();
        const project = document.getElementById('qfProject').value;
        const message = document.getElementById('qfMessage').value.trim();

        if (!name || !email || !phone) {
          alert('Please fill in Name, Email and Phone.');
          return;
        }

        // populate hidden fields (for existing form)
        const nameField = document.getElementById('cName');
        const emailField = document.getElementById('cEmail');
        const phoneField = document.getElementById('cPhone');
        const projectField = document.getElementById('cProject');
        const messageField = document.getElementById('cMessage');
        if (nameField) nameField.value = name;
        if (emailField) emailField.value = email;
        if (phoneField) phoneField.value = phone;
        if (projectField) projectField.value = project;
        if (messageField) messageField.value = message;

        if (typeof handleContact === 'function') {
          handleContact(event || null);
        } else {
          const form = document.querySelector('form');
          if (form) form.submit();
        }

        container.remove();
        addMessage('✅ Thank you. Your quotation request has been received successfully. Our team will contact you shortly.', 'bot');
        console.log('Quotation submitted:', { name, email, phone, project, message });
      });
    }

    // ============================================================
    // COMPLETE SUDARSHANINFRA AI KNOWLEDGE (all Q&A)
    // ============================================================
    function getBotReply(msg) {
      const lower = msg.toLowerCase().trim();

    // ============================================================
    // SEND MESSAGE
    // ============================================================
    function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';

      showTyping();
      setTimeout(() => {
        hideTyping();
        const reply = getBotReply(text);
        addMessage(reply, 'bot');
      }, 500 + Math.random() * 400);
    }

    // ============================================================
    // Event listeners
    // ============================================================
    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSend();
      }
    });

    // Quick buttons - single handler using delegation
    quickGrid.addEventListener('click', function(e) {
      const btn = e.target.closest('.quick-btn');
      if (!btn) return;
      const text = btn.dataset.text || btn.textContent;
      input.value = text;
      handleSend();
    });

    widget.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!sidePanel.classList.contains('open'))
        openPanel();
    else
        input.focus();
});
